# l7-task1: Shell integration for LED sensor driver

# Sensor driver
CONFIG_SENSOR=y

# GPIO
CONFIG_GPIO=y

# Shell - UART backend
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HISTORY=y

# Logging via shell backend (not UART console)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL_LOG_BACKEND=y

# Disable UART console - shell takes over UART
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

# Serial/UART
CONFIG_SERIAL=y
